name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 작업 계획(planning/)만 바꾼 push는 사이트를 다시 배포하지 않습니다.
    paths-ignore:
      - 'planning/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lastUpdated 표시에 git 이력이 필요
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 사이트 안 링크와 anchor가 깨졌으면 배포하지 않습니다.
      - run: npm run check:links
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
