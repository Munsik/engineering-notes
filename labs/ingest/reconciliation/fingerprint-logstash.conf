filter {
  fingerprint {
    source => ["message", "[host][name]", "@timestamp"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][_id]"
  }
}
output {
  elasticsearch {
    hosts => ["https://es01:9200"]
    api_key => "${ES_API_KEY}"
    data_stream => "true"
    # 같은 ID가 다시 오면 409. Logstash ES output은 409를 경고 로그만 남기고 버린다
    document_id => "%{[@metadata][_id]}"
  }
}
