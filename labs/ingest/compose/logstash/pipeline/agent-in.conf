# Agent(Fleet Logstash 출력)에서 받아 Elasticsearch로 보내는 pipeline. lab이라 TLS는 끔
# 2026-11-26 lab 실행에 쓴 그대로 둔다. 운영 구성(enrich => none, mTLS, @metadata._id 분기)은 ../../../no-gap/beats-in.conf를 따른다.
input {
  elastic_agent {
    port => 5044
    ssl_enabled => false
  }
}
output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    api_key => "${ES_API_KEY}"
    data_stream => "true"
  }
}
