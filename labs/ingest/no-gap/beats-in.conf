# Agent(Fleet Logstash 출력)에서 받아 Elasticsearch로 보내는 pipeline
# 공식 예시(https://www.elastic.co/docs/reference/fleet/logstash-output) 기준
# - enrich => none: input이 이벤트에 필드를 덧붙이지 않게 함(Agent 문서 구조 유지)
# - ssl_client_authentication => "required": 인증서가 있는 Agent만 받음(mTLS)
# - [@metadata][_id] 분기: Agent fingerprint로 정한 문서 ID를 Elasticsearch까지 넘김
input {
  elastic_agent {
    port => 5044
    enrich => none
    ssl_enabled => true
    ssl_certificate_authorities => ["/etc/logstash/certs/ca.crt"]
    ssl_certificate => "/etc/logstash/certs/logstash.crt"
    ssl_key => "/etc/logstash/certs/logstash.pkcs8.key"
    ssl_client_authentication => "required"
  }
}
output {
  if [@metadata][_id] {
    elasticsearch {
      hosts => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      api_key => "${ES_API_KEY}"
      data_stream => true
      document_id => "%{[@metadata][_id]}"
      manage_template => false
      ssl_certificate_authorities => ["/etc/logstash/certs/ca.crt"]
    }
  } else {
    elasticsearch {
      hosts => ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      api_key => "${ES_API_KEY}"
      data_stream => true
      manage_template => false
      ssl_certificate_authorities => ["/etc/logstash/certs/ca.crt"]
    }
  }
}
