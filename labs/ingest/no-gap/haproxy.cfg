# TCP syslog를 Logstash 2대로 나누는 예시. HAProxy 자체는 keepalived VIP로 이중화한다
global
    maxconn 20000
defaults
    mode tcp
    timeout connect 5s
    timeout client  1h
    timeout server  1h
frontend syslog_tcp
    bind *:6514
    default_backend logstash_syslog
backend logstash_syslog
    balance leastconn
    option tcp-check
    server ls1 10.0.0.11:6514 check inter 2s fall 2 rise 3
    server ls2 10.0.0.12:6514 check inter 2s fall 2 rise 3
# 노드 정지 전 drain:
#   echo "set server logstash_syslog/ls1 state drain" | socat stdio /run/haproxy/admin.sock
