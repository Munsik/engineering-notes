# nginx stream 모듈 UDP 부하 분산 예시. 오픈소스 nginx는 UDP upstream 능동 health check가 없다(passive만, NGINX Plus는 health_check).
# syslog는 응답이 없어 proxy_responses 0으로 두므로, passive check도 멈춘 수신기를 거의 감지하지 못한다.
# 수신기 상태는 keepalived 같은 외부 check로 보완한다.
stream {
    upstream syslog_udp {
        server 10.0.0.21:514;
        server 10.0.0.22:514;
    }
    server {
        listen 514 udp;
        proxy_pass syslog_udp;
        proxy_responses 0;
    }
}
